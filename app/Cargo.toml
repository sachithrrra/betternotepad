[package]
name = "betternotepad"
version = "1.3.1"
edition = "2024"
description = "A simple, fast plain-text editor for macOS."

[package.metadata.bundle]
name = "Better Notepad"
identifier = "xyz.kronz.betternotepad"
category = "public.app-category.productivity"
short_description = "A simple, fast plain-text editor for macOS."
icon = ["icons/AppIcon.icns"]
[package.metadata.bundle.osx]
minimum_system_version = "11.0"
# Registers Better Notepad in Finder's "Open With" menu for any file (see main.rs on_open_urls),
# and Sparkle's feed/key (see src/updater.rs).
info_plist_exts = ["Info-document-types.plist", "Info-sparkle.plist"]
# `cargo bundle` fails if this is missing, so run scripts/fetch-sparkle.sh first
# (plain `cargo build`/`cargo run`/`cargo test` don't need it).
frameworks = ["vendor/Sparkle.framework"]

[dependencies]
gpui-kit = "0.6.6"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
objc = "0.2"
# No default "html" (a whole HTML engine); "text_layout" is needed to subset embedded fonts,
# otherwise every export carries the full font files (~200KB+ each).
printpdf = { version = "0.12.8", default-features = false, features = ["text_layout"] }
docx-rs = "0.4.22"
# Already in the tree via gpui-kit (its markdown preview); used to render .md exports.
markdown = "1"
# Already in the tree via gpui; finds the settings font's files so PDF export can embed it.
core-text = "21"
# Already in the tree via gpui; the saved session (open tabs and unsaved text) is one JSON file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation = "0.10"

[features]
# Dev only: off-screen PNG render of the window (see `snapshot` in main.rs).
snapshot = ["gpui-kit/test-support"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = true

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }
